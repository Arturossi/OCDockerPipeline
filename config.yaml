# Workflow settings
# Keep below total hardware threads to leave headroom for DB/system tasks.
cpu_cores: 16
overwrite: false

# Database backend (required for --store-db in this pipeline)
db_backend: "postgresql"

# Target selection
# Preferred database selector.
# Supported entries:
# - Presets: "PDBbind", "DUDEz"
# - Alias under ocdb root: "other"  -> <ocdb>/other
# - Explicit path with alias: "mydb=/abs/path/to/MyDB"
# - Explicit path only: "/abs/path/to/MyDB" (alias inferred from directory name)
database_sources:
  # PDBbind and DUDEz temporarily disabled -- LIT-PCBA-only run.
  # - "PDBbind"
  # - "DUDEz"
  - "LITPCBA=/data/hd4tb/OCDocker/data/ocdb2/LITPCBA"
# Legacy fallback (used only when database_sources is omitted):
# run_databases:
#   - "PDBbind"
#   - "DUDEz"
compound_kinds:
  - "ligands"
  - "decoys"
  - "compounds"
# Target discovery:
# - "index": use pdb_database_index/dudez_database_index only
# - "filesystem": scan each selected database root from database_sources
# - "hybrid": merge index + filesystem (recommended)
# Note: index mode is only valid for preset aliases (PDBbind/DUDEz);
# custom path/alias sources must use filesystem or hybrid.
target_discovery_mode: "hybrid"

# Keep old include-based database rules disabled by default.
enable_legacy_database_rules: false

# Pipeline settings
# Docking engines (pose generation) are auto-detected from OCDocker.cfg executables if this key is omitted.
# Each engine is executed as an independent Snakemake job (`run_engine`),
# enabling parallel execution and shared preparation reuse.
# Allowed values for docking are only: vina, gnina, plants.
# pipeline_engines: ["vina", "gnina", "plants"]

# Rescoring always includes all supported engines (vina,smina,gnina,plants,oddt)
# and runs all configured scoring functions for each engine.
# pipeline_rescoring_engines: ["vina", "smina", "gnina", "plants", "oddt"]
pipeline_store_db: true
# Store per-engine progress snapshots in PostgreSQL during `run_engine`
# (rows are written to `pipelineruns` using `<job>__progress__<engine>` names).
pipeline_store_db_mid_execution: true
# Export one consolidated CSV per selected database alias at the end of the DAG
# (written as `<ocdb>/<database>/pipeline_results.csv`).
pipeline_export_database_csv: true
# Persist receptor_descriptors.json and ligand_descriptors.json sidecars while
# exporting CSVs/regenerating snapshots, so descriptor work can be reused later.
pipeline_save_json_descriptors: true
# Include full installed Python package list in run_report.json.
# Keep false for large production runs unless you explicitly need package-level provenance.
pipeline_report_include_python_packages: false

# Engine scheduling (Snakemake threads/resources for `run_engine`)
pipeline_engine_threads_default: 1
pipeline_engine_threads:
  gnina: 2
  vina: 1
  plants: 1

pipeline_engine_mem_mb_default: 1500
pipeline_engine_mem_mb:
  gnina: 1500
  plants: 1500
  vina: 1500

# GPU scheduling for docking jobs.
# By default Gnina consumes 1 GPU slot; Vina/PLANTS consume 0.
# You can disable GPU accounting by setting both values to 0.
#
# NOTE: this deployment runs gnina CPU-only (gnina_no_gpu = yes in
# OCDocker.cfg, confirmed live: `--no_gpu` in the actual process args, 0% GPU
# utilization while gnina jobs run). So this "gpu" resource isn't limiting
# real GPU contention -- it's just a Snakemake scheduling slot. Left at 1 it
# artificially caps gnina to 1 concurrent job even though gnina only claims 2
# CPU threads/job (pipeline_engine_threads.gnina) and the 18-core budget
# could support ~9 concurrent gnina jobs. Set to 9 (18 cores / 2 threads) so
# this resource is never the binding constraint -- real concurrency is then
# governed by --cores and each engine's declared thread count, same as
# vina/plants. (The historical ~60min/ligand slowdown was almost certainly
# CPU thread oversubscription from unbounded concurrent gnina processes
# before any accounting existed, not GPU contention.)
pipeline_engine_gpu_default: 0
pipeline_engine_gpu:
  gnina: 1

# Global GPU pool for Snakemake scheduler.
# This is applied automatically in the snakefile via workflow.global_resources["gpu"].
pipeline_total_gpus: 9

# Optional engine priorities (higher runs first when ready).
# This helps prevent GNINA starvation when many CPU-only jobs are queued.
# Note: run_engine_vina/run_engine_gnina hardcode their own priority in the
# snakefile (160/170) rather than reading this map; only "plants" is wired
# through _engine_priority(). Kept above every prep-stage rule (<=140) so
# docking is preferred over starting new ligand intake.
pipeline_engine_priority_default: 150
pipeline_engine_priority:
  gnina: 100
  plants: 150
  vina: 50

# Optional per-engine parallel caps (max concurrent jobs per engine).
pipeline_engine_max_parallel:
  vina: 10
  plants: 10
  gnina: 10

# Post-processing scheduling (`run_pipeline`)
pipeline_postprocess_threads: 1
pipeline_postprocess_mem_mb: 2500

# Dedicated ODDT rule scheduling (`run_oddt`)
pipeline_oddt_threads: 1
pipeline_oddt_mem_mb: 2000
# Timeout in seconds for ODDT API rescoring per target (0 disables timeout)
pipeline_oddt_timeout: 1800

pipeline_cluster_min: 10.0
pipeline_cluster_max: 20.0
pipeline_cluster_step: 0.1
pipeline_all_boxes: false
# pipeline_timeout: 3600

# Logging settings
logprefix: ""
logDir: "/data/hd4tb/OCDocker/logs"
log_level: "info"    # Options: "debug", "info", "warning", "error", "critical"
log_handler: "file"  # Options: "file", "console", or "file_and_console"

# Dataset settings
pdbbindTarGzPath: "/data/hd4tb/OCDocker/data/PDBbind_v2020_refined.tar.gz"
pdb_database_index: "/data/hd4tb/OCDocker/data/pdbbind_proteins.txt"
ignored_pdb_database_index: "/data/hd4tb/OCDocker/data/problematic_pdbbind_proteins.txt"

dudez_database_index: "/data/hd4tb/OCDocker/data/dudez_proteins.txt"
ignored_dudez_database_index: "/data/hd4tb/OCDocker/data/problematic_dudez_proteins.txt"
